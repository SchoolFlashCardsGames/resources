<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SFC Resources</title>
<link rel="shortcut icon" href="logo.png"/>
<script>try{var t=localStorage.getItem('sfc-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<style>
:root{--primary:#4ECDC4;--secondary:#4ECDC4;--accent:#FFE66D;--dark:#292F36;--light:#F7FFF7;--button:#FF6B6B}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Comic Sans MS",cursive,sans-serif}
body{background:var(--light);color:var(--dark);min-height:100vh;display:flex;flex-direction:column}
.container{width:90%;max-width:1000px;margin:0 auto}
header{background:var(--primary);padding:15px 0;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.header-content{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.logo{font-size:28px;font-weight:bold;color:#fff;text-decoration:none}
.logo span{color:var(--accent)}
.header-right{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
nav ul{display:flex;list-style:none;align-items:center;gap:15px;white-space:nowrap}
nav ul li a{color:#fff;text-decoration:none;font-weight:bold;transition:color .3s;font-size:14px;padding:5px 0}
nav ul li a:hover{color:var(--accent)}
.nb{background:var(--dark);color:var(--accent);border:none;padding:8px 16px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:16px;transition:all .3s}
.nb:hover{background:#454545;color:#fff;transform:scale(1.05)}
.hero{background:var(--secondary);padding:30px 0;text-align:center;color:#fff}
.hero h1{font-size:38px}
main{flex:1;padding:30px 0 50px}
footer{background:var(--dark);color:#fff;padding:25px 0;text-align:center;font-size:14px}
footer .c{color:#aaa}
html[data-theme=dark]{color-scheme:dark}
html[data-theme=dark] body{background:#14181d;color:#e8ecef}
html[data-theme=dark] header,html[data-theme=dark] .hero{background:#000}
html[data-theme=dark] .nb{background:#3a3f47}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:#fff;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.1);padding:25px;text-align:center;border-top:8px solid var(--secondary);transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-5px);box-shadow:0 5px 15px rgba(0,0,0,.2)}
.card h3{font-size:22px;margin-bottom:15px}
.sub{font-size:28px;text-align:center;margin:40px 0 20px}
.btn{display:inline-block;background:var(--button);color:#fff;padding:8px 18px;border-radius:5px;font-weight:bold;text-decoration:none;font-size:15px;transition:background-color .3s}
.btn:hover{background:#454545}
html[data-theme=dark] .card{background:#1f252c;color:#e8ecef}
@media(max-width:700px){.header-content,.header-right{justify-content:center}nav ul{flex-wrap:wrap;justify-content:center}}
</style>
</head>
<body>
<header><div class="container"><div class="header-content">
<a href="games" class="logo">School<span>Flash</span>Cards</a>
<div class="header-right">
<nav><ul>
<li><a href="https://discord.gg/GnVUkcsfMw">Discord</a></li>
<li><a href="https://www.youtube.com/@SFC3GH">YT</a></li>
<li><a href="https://www.tiktok.com/@schoolflashcards">TikTok</a></li>
</ul></nav>
<button class="nb" id="themeBtn" title="Dark mode">🌙</button>
</div>
</div></div></header>
<section class="hero"><div class="container"><h1>SFC Resources</h1></div></section>
<main><div class="container" id="app">
<div class="grid">
<div class="card"><h3>Flashcards Page</h3>
<!-- PUT YOUR FLASHCARDS PAGE LINK IN THE href BELOW (replace #FLASHCARDS_LINK_HERE) -->
<a class="btn" href="https://schoolflashcards.com">Open</a></div>
<div class="card"><h3>Games Page</h3>
<!-- PUT YOUR GAMES PAGE LINK IN THE href BELOW (replace #GAMES_LINK_HERE) -->
<a class="btn" href="https://games.schoolflashcards.com">Open</a></div>
</div>
<h2 class="sub">EKFun Resources</h2>
<div class="grid">
<div class="card"><h3>17-0 Sheet</h3>
<!-- PUT YOUR 17-0 SHEET LINK IN THE href BELOW (replace #SHEET_LINK_HERE) -->
<a class="btn" href="170sheetoption">Open</a></div>
</div>
</div></main>
<footer><div class="container"><p class="c">© 2026 SchoolFlashCards.</p></div></footer>
<script>
document.getElementById('themeBtn').onclick=()=>{const d=document.documentElement,on=d.getAttribute('data-theme')!=='dark';on?d.setAttribute('data-theme','dark'):d.removeAttribute('data-theme');try{localStorage.setItem('sfc-theme',on?'dark':'light')}catch(e){}};
</script>
</body>
</html>
